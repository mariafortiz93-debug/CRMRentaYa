services:
  crm:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Persist database outside container
      - ./data:/app/data
      # Persist user config
      - ./crm-config.json:/app/crm-config.json
    # La clave de acceso NO se copia dentro de la imagen (.dockerignore excluye
    # .env*), asi que se inyecta al arrancar leyendo el archivo local.
    # Debe existir .env.local con CRM_PASSWORD=... junto a este archivo.
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    restart: unless-stopped
